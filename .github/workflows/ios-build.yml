name: iOS Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      sign:
        description: "Build signed IPA (requires secrets)"
        required: false
        default: "false"
      trollstore:
        description: "Build TrollStore-installable unsigned device IPA"
        required: false
        default: "true"

jobs:
  build-simulator:
    name: Build iOS Simulator
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Resolve available simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available | awk -F'[()]' '/iPhone/{print $1; exit}' | xargs)
          if [ -z "$DEVICE" ]; then DEVICE="iPhone 15"; fi
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $DEVICE"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project Sub2API.xcodeproj \
            -scheme Sub2API \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build | xcpretty || xcodebuild \
            -project Sub2API.xcodeproj \
            -scheme Sub2API \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload build products
        uses: actions/upload-artifact@v4
        with:
          name: sub2api-ios-simulator-build
          path: |
            build/DerivedData/Build/Products/Debug-iphonesimulator/Sub2API.app
          if-no-files-found: warn

  trollstore-ipa:
    name: TrollStore IPA
    if: >
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.trollstore != 'false')
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build device app (unsigned)
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild \
            -project Sub2API.xcodeproj \
            -scheme Sub2API \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            build | xcpretty || xcodebuild \
            -project Sub2API.xcodeproj \
            -scheme Sub2API \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package IPA for TrollStore
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Sub2API.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Device app not found at $APP_PATH"
            find build/DerivedData/Build/Products -maxdepth 3 -type d -name '*.app' -print || true
            exit 1
          fi

          # Ensure the binary is an arm64 iOS device build, not a simulator slice.
          BINARY="$APP_PATH/Sub2API"
          file "$BINARY"
          lipo -info "$BINARY" || true

          rm -rf build/Payload build/Sub2API.ipa
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/

          # Strip any residual signature so TrollStore can install cleanly.
          if command -v codesign >/dev/null 2>&1; then
            codesign --remove-signature "build/Payload/Sub2API.app" || true
            find "build/Payload/Sub2API.app" \( -name '*.dylib' -o -name '*.framework' \) | while read -r item; do
              codesign --remove-signature "$item" 2>/dev/null || true
            done
          fi

          (
            cd build
            zip -qry Sub2API.ipa Payload
          )

          ls -lh build/Sub2API.ipa
          unzip -l build/Sub2API.ipa | head -n 40

      - name: Upload TrollStore IPA
        uses: actions/upload-artifact@v4
        with:
          name: sub2api-ios-trollstore-ipa
          path: build/Sub2API.ipa
          if-no-files-found: error

  signed-ipa:
    name: Signed IPA
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.sign == 'true'
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Import certificate and profile
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${IOS_CERTIFICATE_BASE64:-}" ] || [ -z "${IOS_PROVISION_PROFILE_BASE64:-}" ]; then
            echo "Missing signing secrets"
            exit 1
          fi
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Archive and export IPA
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          set -euo pipefail
          BUNDLE_ID=${IOS_BUNDLE_ID:-org.sub2api.app}
          xcodebuild \
            -project Sub2API.xcodeproj \
            -scheme Sub2API \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Sub2API.xcarchive \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            archive

          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string>${IOS_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/Sub2API.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist build/ExportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: sub2api-ios-ipa
          path: build/ipa/*.ipa